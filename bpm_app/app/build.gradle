plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.bpm_player'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.bpm_player"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    signingConfigs {
        release {
            // Usa o debug keystore (gerado automaticamente pelo Android SDK)
            // Ideal para instalação USB de teste rápido. Para publicar na Play Store,
            // crie um keystore próprio e configure via ~/.gradle/gradle.properties.
            def userHome = System.getenv("ANDROID_USER_HOME") ?: System.getProperty("user.home")
            storeFile file("$userHome/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            // Sem minify/shrink no debug — evita erros de mapping.txt e builds mais rápidos
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Media3 ExoPlayer (nova versão do ExoPlayer, mais estável)
    implementation 'androidx.media3:media3-exoplayer:1.3.1'

    // Core Kotlin
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.21'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // Room, WorkManager, OkHttp, YouTube Extractor, Gson removidos — sem playlist/download
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.bpm_player'
    compileSdk 36

    defaultConfig {
        // Play recusa "com.example.*"; o ID é permanente depois do 1º upload
        applicationId "io.github.netstart.beattrack"
        minSdk 24 // ONNX Runtime e a proteção automática do Play exigem 24
        targetSdk 36
        versionCode((System.getenv("VERSION_CODE") ?: "2").toInteger()) // CI: número do run
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // x86 (32-bit) só existe em emuladores antigos; cortar economiza ~45 MB do ONNX Runtime
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        // AdMob: IDs de teste do Google (sempre seguros); o release troca pelos reais
        manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
        buildConfigField "String", "ADMOB_BANNER_ID", '"ca-app-pub-3940256099942544/9214589741"'
    }

    // Modelo de separação (~300 MB) vai num asset pack install-time: chega com o app, sem download
    assetPacks = [':model_pack']
    // sem compressão: o app mapeia o .onnx direto do APK, sem copiar
    androidResources { noCompress 'onnx' }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    signingConfigs {
        release {
            // CI/Play: keystore de upload via variáveis de ambiente. Local sem elas: debug keystore (instalação USB).
            def ks = System.getenv("UPLOAD_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
                keyAlias System.getenv("UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("UPLOAD_KEY_PASSWORD")
            } else {
                def userHome = System.getenv("ANDROID_USER_HOME") ?: System.getProperty("user.home")
                storeFile file("$userHome/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            // Sem minify/shrink no debug — evita erros de mapping.txt e builds mais rápidos
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // AdMob real (app BeatTrack, bloco "Banner rodape"); IDs não são segredo, vão no APK
            manifestPlaceholders = [admobAppId: "ca-app-pub-6552169828297838~7776540821"]
            buildConfigField "String", "ADMOB_BANNER_ID", '"ca-app-pub-6552169828297838/2632025351"'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // Media3 ExoPlayer — decode de hardware via MediaCodec interno
    // expõe AudioProcessor API para interceptar PCM pós-decode
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-common:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'

    // Core Kotlin
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'

    // Coroutines (essencial para StateFlow e dispatchers)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // Lifecycle (para observeWithLifecycle e ViewModel)
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Activity-ktx para Activity
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // Separação de stems on-device (HTDemucs via ONNX Runtime + XNNPACK) — ver docs/PLANO_STEMS.md
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.32.0'
    implementation 'androidx.documentfile:documentfile:1.0.1' // pasta escolhida para os elementos separados

    // ── Fase 0: benchmark de separação de stems (somente debug; ver docs/PLANO_STEMS.md) ──
    debugImplementation 'com.google.ai.edge.litert:litert:1.4.2'
    debugImplementation 'com.google.ai.edge.litert:litert-gpu:1.4.2'
    debugImplementation 'com.google.ai.edge.litert:litert-gpu-api:1.4.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303' // org.json real nos testes de JVM (o do android.jar é só stub)

    // ── Testes instrumentados (UI) ──
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}

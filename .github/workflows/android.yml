# Build + deploy no Google Play. Setup único: docs/GOOGLE_PLAY.md
# Sem testes aqui: rodam só na máquina do desenvolvedor (AGENTS.md)
# push na main  → teste fechado (track "alpha")
# Actions → "Run workflow" → track production → produção
name: Android

on:
  push:
    branches: [main]
    paths-ignore: ['structures/**'] # catálogo de estruturas não gera versão do app
  workflow_dispatch:
    inputs:
      track:
        description: Track do Google Play
        type: choice
        options: [alpha, production]
        default: alpha
      status:
        description: "completed = publica; draft = só rascunho (obrigatório enquanto o app não passou na 1ª revisão)"
        type: choice
        options: [completed, draft]
        default: completed

concurrency:
  group: play-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: bpm_app
    env:
      VERSION_CODE: ${{ github.run_number }}0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore de upload
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret UPLOAD_KEYSTORE_BASE64 ausente (ver docs/GOOGLE_PLAY.md)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # Testes rodam só na máquina do desenvolvedor (AGENTS.md)
      - name: AAB release
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.VERSION_CODE }}
          path: |
            bpm_app/app/build/outputs/bundle/release/app-release.aab
            bpm_app/app/build/outputs/mapping/release/mapping.txt

      - name: Publicar no Google Play
        if: ${{ vars.PLAY_ENABLED == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.netstart.beattrack
          releaseFiles: bpm_app/app/build/outputs/bundle/release/app-release.aab
          mappingFile: bpm_app/app/build/outputs/mapping/release/mapping.txt
          tracks: ${{ inputs.track || 'alpha' }}
          status: ${{ inputs.status || vars.PLAY_STATUS || 'completed' }}

# Issue "Estrutura de música" aprovada (rótulo estrutura-aprovada, que só o mantenedor aplica) → pull request
# com os arquivos em structures/. Sem testes aqui (AGENTS.md).
name: Estrutura

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pr:
    if: github.event.label.name == 'estrutura-aprovada'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gravar arquivos da issue
        id: write
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: echo "id=$(node .github/scripts/estrutura-from-issue.mjs)" >> "$GITHUB_OUTPUT"

      - name: Abrir pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.write.outputs.id }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          branch="estrutura/$ID-$NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add structures
          git commit -m "$TITLE (#$NUMBER)"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "$TITLE" --body "Closes #$NUMBER"
